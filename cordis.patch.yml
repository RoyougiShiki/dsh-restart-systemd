# dsh-restart-systemd bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); install with dsh plugin --profile web add /tmp/dsh-restart-systemd
# (or add the package to the profile's bundle list).
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process and owns the loopback-fenced POST /api/restart-dsh route,
# the fixed systemctl --user restart dsh-web argv, single-flight dedup, and the
# $DSH_HOME/dsh-restart.flag boot-suppression token. The dsh.client declaration
# in package.json makes the browser half (exports "./client", served at
# /plugins/ui-dsh-restart-systemd/client.js) load in the web GUI and mount the
# sidebar-footer restart trigger next to the remote-web-ui phone icon.
- insert:
    - id: ui-dsh-restart-systemd
      name: dsh-restart-systemd
